# Fly configuration for the Go API. Secrets are set with `fly secrets`.

app = "macrocart-api"
primary_region = "iad" # us-east; closest Fly region to Chapel Hill

[build]
  dockerfile = "Dockerfile"

[env]
  # Non-secret configuration only. Everything here is safe in a public repo.
  PORT = "4000"

  # The solver is reachable only on Fly's private network.
  SOLVER_ADDR = "macrocart-solver.internal:50051"

[http_service]
  internal_port = 4000
  force_https = true

  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # This endpoint checks Postgres as well as the API process.
    path = "/v1/healthcheck"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
