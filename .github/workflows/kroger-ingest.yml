name: Refresh Kroger prices

on:
  # Refresh University Place (location 09700117) each morning.
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and validate prices without writing to Postgres
        type: boolean
        default: true
        required: true

# Never let two refreshes race to update availability and price history.
concurrency:
  group: kroger-price-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    name: Refresh deployed product prices
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.MACRO_MAX_FLY_API_APP }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          test -n "$FLY_API_TOKEN" || { echo "Missing FLY_API_TOKEN secret"; exit 1; }
          test -n "$FLY_APP" || { echo "Missing MACRO_MAX_FLY_API_APP variable"; exit 1; }
          [[ "$FLY_APP" =~ ^[a-z0-9-]+$ ]] || { echo "Invalid Fly app name"; exit 1; }

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Refresh prices
        shell: bash
        run: |
          ingest_command="krogeringest"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            ingest_command="$ingest_command -dry-run"
          fi
          flyctl ssh console --app "$FLY_APP" --command "$ingest_command"
