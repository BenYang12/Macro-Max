name: Refresh Kroger prices

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and validate prices without writing to Postgres
        type: boolean
        default: true
        required: true

concurrency:
  group: kroger-price-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    name: Refresh prices in Neon
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
      KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate configuration
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "Missing NEON_DATABASE_URL secret"; exit 1; }
          test -n "$KROGER_CLIENT_ID" || { echo "Missing KROGER_CLIENT_ID secret"; exit 1; }
          test -n "$KROGER_CLIENT_SECRET" || { echo "Missing KROGER_CLIENT_SECRET secret"; exit 1; }

      - name: Refresh prices
        shell: bash
        run: |
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            args+=("-dry-run")
          fi
          go run ./cmd/krogeringest "${args[@]}"
