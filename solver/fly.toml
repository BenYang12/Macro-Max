# fly.toml — deployment config for the PYTHON OR-TOOLS SOLVER.
#
# A separate Fly app from the API, for the reason spelled out in the root
# fly.toml: they scale on different axes. This one is CPU- and memory-bound
# (SCIP branch-and-bound on a few hundred variables) and gets hit only when
# someone actually solves.
#
# NOT DEPLOYED. Written and reviewed only — see the note in the root fly.toml.
#
#   fly apps create macrocart-solver
#   fly deploy --config solver/fly.toml --dockerfile solver/Dockerfile

app = "macrocart-solver"
primary_region = "iad" # MUST match the API's region: a cross-region gRPC call
                       # on every solve would add more latency than the solve

[build]
  dockerfile = "Dockerfile"

# NO [http_service] BLOCK, and its absence is the important part.
#
# This service speaks gRPC (HTTP/2 with binary framing), not HTTP/1.1, and it
# has NO AUTHENTICATION of any kind — it trusts whoever can reach the port. So
# it must never be exposed publicly. Omitting http_service means Fly assigns no
# public IP, and the only way in is the private *.internal network, where the
# API addresses it as macrocart-solver.internal:50051.
#
# The network boundary IS the security model here. If this ever needs a public
# address, it needs authentication first — not the other way around.
[[services]]
  internal_port = 50051
  protocol = "tcp"

  # No auto_stop. A cold start here means importing OR-Tools and rebuilding the
  # model, which is seconds rather than milliseconds — long enough that the
  # API's gRPC call could time out and turn a scale-to-zero saving into a failed
  # solve. The API can scale to zero because its cold start is fast; this one
  # can't for the same reason.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.tcp_checks]]
    # A plain TCP check, matching the Compose healthcheck: there's no HTTP
    # endpoint to hit, and "is something accepting connections on 50051" is the
    # question that actually matters.
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  # 1GB, not 512MB. OR-Tools loads a substantial native library, and SCIP's
  # branch-and-bound holds a tree of LP relaxations in memory. An
  # out-of-memory kill mid-solve would surface to the user as an opaque gRPC
  # transport error, which is a miserable thing to debug for the sake of a few
  # dollars a month.
  size = "shared-cpu-1x"
  memory = "1gb"
